<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abyss Engine Data Reset (debug)</title>
<style>
  :root{--bg:#07131c;--panel:#0d2230;--line:#1b4057;--txt:#d6eef7;--dim:#7fa6b8;--acc:#2fd0c4;--bad:#ff5d6c;--ok:#5be37d;--warn:#ffd166}
  *{box-sizing:border-box}
  body{margin:auto;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,sans-serif;padding:16px;max-width:760px}
  h1{font-size:22px;margin:8px 0 2px;color:var(--acc)}
  p.sub{color:var(--dim);margin:0 0 16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
  h2{font-size:14px;margin:0 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid #123245;word-break:break-all}
  .row:last-child{border:0}
  .row .v{color:var(--dim);text-align:right}
  .ok{color:var(--ok)!important}.bad{color:var(--bad)!important}.warn{color:var(--warn)!important}
  button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 14px;margin:4px 6px 4px 0;cursor:pointer;background:#16445a;color:var(--txt)}
  button.danger{background:var(--bad);color:#fff}
  button.mini{padding:4px 8px;margin:0;font-size:12px}
  label{display:block;margin:6px 0;color:var(--dim)}
  input[type=text]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#06101a;color:var(--txt);font:inherit}
  #log{font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto;background:#050d14;padding:8px;border-radius:8px}
  .l-err{color:var(--bad)}.l-ok{color:var(--ok)}.l-warn{color:var(--warn)}.l-inf{color:var(--acc)}
  .key{font:12px ui-monospace,monospace;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid #123245}
  .key span.n{word-break:break-all}
  .key small{color:var(--dim)}
  #banner{display:none;margin-bottom:12px}
</style>
</head>
<body>
<h1>Abyss Engine Data Reset</h1>
<p class="sub">Debug build. Everything it does is logged below.</p>

<div id="banner" class="card"></div>

<div class="card"><h2>Environment</h2><div id="env"></div></div>
<div class="card"><h2>Storage access test</h2><div id="probe"></div></div>
<div class="card"><h2>What's stored</h2><div id="found">Scanning…</div></div>
<div class="card"><h2>localStorage keys</h2><div id="keys"></div></div>
<div class="card"><h2>IndexedDB</h2><div id="idb"></div>
  <label>Extra database names to try (comma separated), for browsers that can't list them:</label>
  <input type="text" id="extraDB" placeholder="abyss, abyss-engine, kraken, keyval-store">
</div>

<div class="card">
  <h2>Options</h2>
  <label><input type="checkbox" id="oLS" checked> localStorage</label>
  <label><input type="checkbox" id="oSS" checked> sessionStorage</label>
  <label><input type="checkbox" id="oIDB" checked> IndexedDB</label>
  <label><input type="checkbox" id="oCache" checked> Cache Storage + service workers</label>
  <label><input type="checkbox" id="oCookie" checked> Cookies</label>
</div>

<div class="card">
  <button id="bBackup">Download backup</button>
  <button id="bRescan">Rescan</button>
  <button id="bWipe" class="danger">Wipe selected data</button>
  <button id="bCopy">Copy debug log</button>
</div>

<div class="card"><h2>Log</h2><div id="log"></div></div>

<script>
const $ = id => document.getElementById(id);
const LOGLINES = [];
function log(m, cls){
  const t = new Date().toTimeString().slice(0,8);
  LOGLINES.push('['+t+'] '+m);
  const d = document.createElement('div');
  d.className = 'l-' + (cls||'inf');
  d.textContent = '['+t+'] '+m;
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
}
const errStr = e => (e && (e.name+': '+e.message)) || String(e);
window.addEventListener('error', e => log('UNCAUGHT: '+e.message+' @'+(e.lineno||'?'), 'err'));
window.addEventListener('unhandledrejection', e => log('UNHANDLED PROMISE: '+errStr(e.reason), 'err'));
const fmt = n => n < 1024 ? n+' B' : (n/1024).toFixed(1)+' KB';
const row = (k,v,c) => '<div class="row"><span>'+k+'</span><span class="v '+(c||'')+'">'+v+'</span></div>';
const esc = s => String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ---------- environment ----------
function showEnv(){
  const proto = location.protocol;
  let h = '';
  h += row('URL', esc(location.href.slice(0,120)));
  h += row('Protocol', proto, proto==='file:'?'warn':'');
  h += row('Origin', esc(location.origin), location.origin==='null'?'bad':'');
  h += row('In iframe', (window.top!==window.self)?'yes':'no', (window.top!==window.self)?'warn':'');
  h += row('Secure context', String(window.isSecureContext));
  h += row('Cookies enabled', String(navigator.cookieEnabled));
  h += row('User agent', esc(navigator.userAgent.slice(0,90)));
  $('env').innerHTML = h;
  log('Origin = '+location.origin+' | protocol = '+proto);
  const b = $('banner');
  if (location.origin === 'null' || proto === 'file:'){
    b.style.display='block';
    b.innerHTML = '<b class="warn">Opened as a local file.</b> Browsers give each local file its own (or an opaque "null") origin, so this page often CANNOT see the engine\'s data. Fix: open the engine and this page from the same real address (e.g. host both in the same folder on the same site / local server, GitHub Pages, etc.), OR put this reset code inside the engine\'s own page.';
  }
}

// ---------- probe ----------
async function runProbe(){
  let h = '';
  // localStorage
  try { const k='__abyss_probe__'; localStorage.setItem(k,'1'); const ok = localStorage.getItem(k)==='1'; localStorage.removeItem(k); h+=row('localStorage read/write', ok?'OK':'FAILED', ok?'ok':'bad'); log('localStorage probe: '+(ok?'ok':'failed'), ok?'ok':'err'); }
  catch(e){ h+=row('localStorage', esc(errStr(e)), 'bad'); log('localStorage probe threw: '+errStr(e),'err'); }
  try { const k='__abyss_probe__'; sessionStorage.setItem(k,'1'); sessionStorage.removeItem(k); h+=row('sessionStorage read/write','OK','ok'); }
  catch(e){ h+=row('sessionStorage', esc(errStr(e)), 'bad'); log('sessionStorage probe threw: '+errStr(e),'err'); }
  // idb
  if (!window.indexedDB){ h+=row('indexedDB','not available','bad'); log('indexedDB undefined','err'); }
  else {
    try {
      await new Promise((res,rej)=>{ const r=indexedDB.open('__abyss_probe__'); r.onsuccess=()=>{r.result.close(); indexedDB.deleteDatabase('__abyss_probe__'); res();}; r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blocked')); });
      h+=row('indexedDB open/delete','OK','ok'); log('indexedDB probe ok','ok');
    } catch(e){ h+=row('indexedDB', esc(errStr(e)), 'bad'); log('indexedDB probe failed: '+errStr(e),'err'); }
    h+=row('indexedDB.databases()', indexedDB.databases?'supported':'NOT supported (can\'t list)', indexedDB.databases?'ok':'warn');
  }
  h+=row('Cache Storage', window.caches?'available':'unavailable', window.caches?'ok':'warn');
  h+=row('Service workers', navigator.serviceWorker?'available':'unavailable', navigator.serviceWorker?'ok':'warn');
  try { if (navigator.storage && navigator.storage.estimate){ const e = await navigator.storage.estimate(); h+=row('Origin storage used', fmt(e.usage||0)+' of '+fmt(e.quota||0)); log('storage.estimate usage='+fmt(e.usage||0)); } } catch(e){}
  $('probe').innerHTML = h;
}

// ---------- scan ----------
async function listIDB(){
  const extra = ($('extraDB').value||'').split(',').map(s=>s.trim()).filter(Boolean);
  let names = [];
  if (indexedDB && indexedDB.databases){
    try { names = (await indexedDB.databases()).map(d=>d.name).filter(Boolean); } catch(e){ log('indexedDB.databases() failed: '+errStr(e),'err'); }
  }
  extra.forEach(n=>{ if(!names.includes(n)) names.push(n); });
  return names;
}
function describeDB(name){
  return new Promise(res=>{
    let r; try { r = indexedDB.open(name); } catch(e){ return res('open threw '+errStr(e)); }
    r.onerror = () => res('open error: '+(r.error&&r.error.name));
    r.onblocked = () => res('blocked');
    r.onsuccess = async () => {
      const db = r.result;
      const stores = Array.from(db.objectStoreNames);
      const parts = [];
      for (const s of stores){
        try {
          const n = await new Promise((ok,no)=>{ const q=db.transaction(s,'readonly').objectStore(s).count(); q.onsuccess=()=>ok(q.result); q.onerror=()=>no(q.error); });
          parts.push(s+'('+n+')');
        } catch(e){ parts.push(s+'(?)'); }
      }
      db.close();
      res('v'+db.version+' stores: '+(parts.join(', ')||'none'));
    };
  });
}

async function scan(){
  let ls=0, lsBytes=0, ss=0;
  $('keys').innerHTML='';
  try {
    ls = localStorage.length;
    const items=[];
    for (let i=0;i<ls;i++){ const k=localStorage.key(i); const v=localStorage.getItem(k)||''; lsBytes+=(k.length+v.length)*2; items.push([k,v]); }
    items.sort((a,b)=>b[1].length-a[1].length);
    $('keys').innerHTML = items.length ? items.map(([k,v])=>'<div class="key"><span class="n">'+esc(k)+'<br><small>'+fmt(v.length*2)+' · '+esc(v.slice(0,60))+(v.length>60?'…':'')+'</small></span><button class="mini" data-k="'+esc(k).replace(/"/g,'&quot;')+'">delete</button></div>').join('') : '<span style="color:var(--dim)">none</span>';
    $('keys').querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{ const k=b.getAttribute('data-k'); try{ localStorage.removeItem(k); log('Deleted key '+k,'ok'); }catch(e){ log('Delete failed: '+errStr(e),'err'); } scan(); });
  } catch(e){ log('localStorage scan failed: '+errStr(e),'err'); $('keys').innerHTML='<span class="bad">'+esc(errStr(e))+'</span>'; }
  try { ss = sessionStorage.length; } catch(e){}
  let cacheN=0, swN=0;
  try { cacheN=(await caches.keys()).length; } catch(e){}
  try { swN=(await navigator.serviceWorker.getRegistrations()).length; } catch(e){}
  const ck = document.cookie ? document.cookie.split(';').length : 0;
  $('found').innerHTML =
    row('localStorage keys', ls+' ('+fmt(lsBytes)+')', ls?'warn':'') +
    row('sessionStorage keys', ss, ss?'warn':'') +
    row('Cache Storage entries', cacheN, cacheN?'warn':'') +
    row('Service workers', swN, swN?'warn':'') +
    row('Cookies (visible to JS)', ck, ck?'warn':'');
  // idb
  const names = await listIDB();
  if (!names.length){ $('idb').innerHTML = '<span style="color:var(--dim)">No databases found.</span>'; }
  else {
    let h=''; for (const n of names){ h += row(esc(n), esc(await describeDB(n))); }
    $('idb').innerHTML = h;
  }
  log('Scan: LS='+ls+' SS='+ss+' IDB='+names.length+' caches='+cacheN+' SW='+swN+' cookies='+ck);
  return {ls,ss,idb:names.length,cacheN,swN,ck};
}

// ---------- backup ----------
function backup(){
  try {
    const data={origin:location.origin,localStorage:{},sessionStorage:{},note:'IndexedDB not included'};
    for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); data.localStorage[k]=localStorage.getItem(k); }
    for (let i=0;i<sessionStorage.length;i++){ const k=sessionStorage.key(i); data.sessionStorage[k]=sessionStorage.getItem(k); }
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
    a.download='abyss-backup-'+Date.now()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    log('Backup download triggered ('+Object.keys(data.localStorage).length+' localStorage keys).','ok');
  } catch(e){ log('Backup failed: '+errStr(e),'err'); }
}

// ---------- wipe ----------
function deleteDB(name){
  return new Promise(res=>{
    let r; try { r = indexedDB.deleteDatabase(name); } catch(e){ return res('threw '+errStr(e)); }
    const timer = setTimeout(()=>res('TIMEOUT (probably blocked by another open tab/engine - close it)'), 6000);
    r.onsuccess=()=>{clearTimeout(timer);res('deleted');};
    r.onerror=()=>{clearTimeout(timer);res('error '+errStr(r.error));};
    r.onblocked=()=>log('  "'+name+'" delete BLOCKED - close other Abyss tabs/windows','warn');
  });
}

let armed=false, armTimer=null;
async function wipe(){
  const btn=$('bWipe');
  // inline two-tap confirm (confirm() is silently blocked in many in-app browsers/webviews)
  if (!armed){
    armed=true; btn.textContent='TAP AGAIN TO CONFIRM WIPE';
    log('Armed. Tap the red button again within 5s to wipe.','warn');
    armTimer=setTimeout(()=>{armed=false;btn.textContent='Wipe selected data';log('Confirm timed out.','warn');},5000);
    return;
  }
  clearTimeout(armTimer); armed=false; btn.textContent='Wipe selected data';
  log('=== WIPE START ===','warn');
  const before = await scan();

  if ($('oLS').checked){
    try { const n=localStorage.length; localStorage.clear(); log('localStorage.clear() ran ('+n+' keys before, '+localStorage.length+' after)', localStorage.length?'err':'ok'); }
    catch(e){ log('localStorage.clear() threw: '+errStr(e),'err'); }
  }
  if ($('oSS').checked){
    try { sessionStorage.clear(); log('sessionStorage cleared.','ok'); } catch(e){ log('sessionStorage threw: '+errStr(e),'err'); }
  }
  if ($('oIDB').checked){
    const names = await listIDB();
    if (!names.length) log('No IndexedDB names to delete (type names in the box above if you know them).','warn');
    for (const n of names){ log('Deleting IndexedDB "'+n+'" …'); log('  → '+await deleteDB(n)); }
  }
  if ($('oCache').checked){
    try { for (const k of await caches.keys()){ await caches.delete(k); log('Cache "'+k+'" deleted.','ok'); } } catch(e){ log('Cache delete: '+errStr(e),'warn'); }
    try { for (const r of await navigator.serviceWorker.getRegistrations()){ await r.unregister(); log('Service worker unregistered.','ok'); } } catch(e){ log('SW unregister: '+errStr(e),'warn'); }
  }
  if ($('oCookie').checked){
    const names=document.cookie.split(';').map(c=>c.split('=')[0].trim()).filter(Boolean);
    names.forEach(n=>{
      document.cookie=n+'=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
      document.cookie=n+'=;expires=Thu, 01 Jan 1970 00:00:00 GMT';
    });
    log('Cookie delete attempted for '+names.length+' cookie(s). (HttpOnly cookies can\'t be touched from JS.)');
  }

  log('--- VERIFYING ---');
  const after = await scan();
  const left = after.ls+after.ss+after.idb+after.cacheN+after.swN+after.ck;
  if (!left) log('Everything this origin could see is now empty. Fully close and reopen the engine, then reload.','ok');
  else log('Items still remain (see counts above). If counts were already 0 BEFORE the wipe, this page is on a different origin than the engine - see Environment.','err');
  if (before.ls+before.ss+before.idb+before.cacheN+before.swN+before.ck===0)
    log('NOTE: nothing was found at all before the wipe. That strongly suggests an ORIGIN MISMATCH (engine stores data somewhere this page cannot see).','err');
  log('=== WIPE END ===','warn');
}

async function copyLog(){
  const text = LOGLINES.join('\n');
  try { await navigator.clipboard.writeText(text); log('Log copied to clipboard.','ok'); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); log('Log copied (fallback).','ok'); }catch(e2){ log('Copy failed: '+errStr(e2)+' - long-press the log text to select it manually.','err'); }
    ta.remove();
  }
}

$('bBackup').onclick=backup;
$('bRescan').onclick=()=>{scan();};
$('bWipe').onclick=()=>{wipe().catch(e=>log('WIPE CRASHED: '+errStr(e),'err'));};
$('bCopy').onclick=copyLog;

(async()=>{
  log('Page loaded.');
  showEnv();
  await runProbe();
  await scan();
  log('Ready.');
})().catch(e=>log('INIT CRASHED: '+errStr(e),'err'));
</script>
</body>
</html>
